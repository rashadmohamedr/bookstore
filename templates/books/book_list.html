{% extends "_base.html" %}
{% block title %}Books{% endblock title %}
{% block content %}
{% for book in book_list %}
<div class="d-flex align-items-center mb-2">
    <h2 class="me-3"><a href="{{book.get_absolute_url}}">{{ book.title }}</a></h2>
    <form method="post" action="{% url 'cart_add' %}" class="d-flex align-items-center gap-2">
        {% csrf_token %}
        <input type="hidden" name="book_id" value="{{ book.pk }}">
        <input type="hidden" name="next" value="{{ request.path }}">
        <input type="number" name="quantity" value="1" min="1" max="99" class="form-control form-control-sm" style="width:70px">
        <button type="submit" class="btn btn-sm btn-primary">Add to Cart</button>
    </form>
</div>
{% endfor %}
{% endblock content %}
